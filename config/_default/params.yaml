# SITE SETUP
# Guide: https://docs.hugoblox.com/tutorial/
# Documentation: https://docs.hugoblox.com/
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Appearance
appearance:
  mode: dark
  color: teal

# SEO
marketing:
  seo:
    site_type: Person
    local_business_type: ''
    org_name: ''
    description: 'PhD Student at Georgia Tech, with research interests in developing multimodal systems.'
    twitter: 'praeclarumjj'
  analytics:
    google_analytics: ''
    baidu_tongji: ''
    plausible: ''
    fathom: ''
    pirsch: ''
  verification:
    google: ''
    baidu: ''

# Site header
header:
  navbar:
    enable: true
    blox: "navbar"
    align: "right"
    fixed_to_top: true
    show_search: false
    highlight_active_link: true
    show_theme_chooser: false
    logo:
      text: "Jitesh Jain"

# Site footer
footer:
  copyright:
    notice: '© {2024} Jitesh Jain'
    license:
      enable: false
      allow_derivatives: false
      share_alike: false
      allow_commercial: false

# Localization
locale:
  date_format: 'Jan 2006'
  time_format: '17:04'

# Site features
features:
  math:
    enable: true
  privacy_pack:
    enable: true
